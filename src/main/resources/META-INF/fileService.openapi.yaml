openapi: 3.1.1

info:
  title: "Abstract File Service"
  summary: "A service for managing files in a storage system."
  version: "0.0.1"

servers:
  - url: "https://localhost:6000/microservice/abstract-file-service/v1"
    description: "Version 1 of the Abstract File Service API"

paths:
  "/v1/files":
    get:
      description: "Simple search - Returns file IDs that include the given tags."
      operationId: "searchFilesByTags"
      parameters:
        - $ref: "#/components/parameters/tags"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: "Files retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      description: "Upload a new file."
      operationId: "createFile"
      requestBody:
        required: true
        $ref: "#/components/requestBodies/CreateFileRequest"
      responses:
        "201":
          description: "File created successfully"
          headers:
            Location:
              description: "URL of the created file"
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileProperties"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  "/v1/files/{file-id}":
    get:
      description: "Gets file metadata and basic information."
      operationId: "getFileById"
      parameters:
        - $ref: "#/components/parameters/fileId"
      responses:
        "200":
          description: "File metadata retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileProperties"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      description: "Replaces the entire file (content and metadata)."
      operationId: "replaceFile"
      parameters:
        - $ref: "#/components/parameters/fileId"
      requestBody:
        required: true
        $ref: "#/components/requestBodies/CreateFileRequest"
      responses:
        "200":
          description: "File replaced successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileProperties"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      description: "Deletes a file."
      operationId: "deleteFile"
      parameters:
        - $ref: "#/components/parameters/fileId"
      responses:
        "204":
          description: "File deleted successfully"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  "/v1/files:search":
    post:
      description: "Advanced search for files with complex criteria."
      operationId: "searchFiles"
      requestBody:
        required: true
        $ref: "#/components/requestBodies/SearchFilesRequest"
      responses:
        "200":
          description: "Search completed successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  "/v1/files/{file-id}/properties":
    get:
      description: "Returns detailed properties of a specific file."
      operationId: "getFileProperties"
      parameters:
        - $ref: "#/components/parameters/fileId"
      responses:
        "200":
          description: "File properties retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileProperties"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      description: "Updates specific properties of a file."
      operationId: "updateFileProperties"
      parameters:
        - $ref: "#/components/parameters/fileId"
      requestBody:
        required: true
        $ref: "#/components/requestBodies/UpdateFilePropertiesRequest"
      responses:
        "200":
          description: "File properties updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileProperties"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  "/v1/files/{file-id}/content":
    get:
      description: "Downloads the file content."
      operationId: "downloadFileContent"
      parameters:
        - $ref: "#/components/parameters/fileId"
      responses:
        "200":
          $ref: "#/components/responses/FileContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      description: "Replaces the file content while preserving metadata."
      operationId: "updateFileContent"
      parameters:
        - $ref: "#/components/parameters/fileId"
      requestBody:
        required: true
        $ref: "#/components/requestBodies/UpdateFileContentRequest"
      responses:
        "200":
          description: "File content updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileProperties"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  "/v1/files/{file-id}/tags":
    get:
      description: "Gets all tags associated with a file."
      operationId: "getFileTags"
      parameters:
        - $ref: "#/components/parameters/fileId"
      responses:
        "200":
          description: "File tags retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      description: "Replaces all tags for a file."
      operationId: "replaceFileTags"
      parameters:
        - $ref: "#/components/parameters/fileId"
      requestBody:
        required: true
        $ref: "#/components/requestBodies/TagsRequest"
      responses:
        "200":
          description: "File tags replaced successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      description: "Adds new tags to a file."
      operationId: "addFileTags"
      parameters:
        - $ref: "#/components/parameters/fileId"
      requestBody:
        required: true
        $ref: "#/components/requestBodies/TagsRequest"
      responses:
        "200":
          description: "Tags added successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  "/v1/files/{file-id}/tags/{tag-name}":
    delete:
      description: "Removes a specific tag from a file."
      operationId: "removeFileTag"
      parameters:
        - $ref: "#/components/parameters/fileId"
        - $ref: "#/components/parameters/tagName"
      responses:
        "204":
          description: "Tag removed successfully"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  "/v1/files/{file-id}/access-permissions":
    get:
      description: "Gets access permissions for a file."
      operationId: "getFileAccessPermissions"
      parameters:
        - $ref: "#/components/parameters/fileId"
      responses:
        "200":
          description: "Access permissions retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPermissionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      description: "Updates access permissions for a file."
      operationId: "updateFileAccessPermissions"
      parameters:
        - $ref: "#/components/parameters/fileId"
      requestBody:
        required: true
        $ref: "#/components/requestBodies/AccessPermissionsRequest"
      responses:
        "200":
          description: "Access permissions updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPermissionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    fileId:
      description: "ID to identify the file."
      name: file-id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FileId"

    tagName:
      description: "Name of the tag."
      name: tag-name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]+$"
        minLength: 1
        maxLength: 50

    tags:
      description: "Filter files by tags."
      name: tags
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string

    limit:
      description: "Maximum number of results to return."
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

    offset:
      description: "Number of results to skip for pagination."
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  requestBodies:
    CreateFileRequest:
      description: "Create a new file with content and metadata"
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
              - name
              - mime-type
            properties:
              file:
                type: string
                format: binary
                description: "The file content to upload"
              name:
                $ref: "#/components/schemas/Filename"
              mime-type:
                $ref: "#/components/schemas/SupportedMediaType"
              owner-id:
                $ref: "#/components/schemas/OwnerId"
              tags:
                $ref: "#/components/schemas/Tags"
              access-permissions:
                $ref: "#/components/schemas/AccessRights"
              locations:
                $ref: "#/components/schemas/FileLocation"

    UpdateFilePropertiesRequest:
      description: "Update specific properties of a file"
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                $ref: "#/components/schemas/Filename"
              owner-id:
                $ref: "#/components/schemas/OwnerId"
              access-permissions:
                $ref: "#/components/schemas/AccessRights"
              metadata:
                $ref: "#/components/schemas/Metadata"
              tags:
                $ref: "#/components/schemas/Tags"
              locations:
                $ref: "#/components/schemas/FileLocation"

    SearchFilesRequest:
      description: "Advanced search request with complex criteria"
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              criteria:
                $ref: "#/components/schemas/SearchCriteria"
              options:
                $ref: "#/components/schemas/SearchOptions"
              return-type:
                type: string
                enum: ["ids", "properties", "summary"]
                default: "summary"
                description: "Format of the search results"

    UpdateFileContentRequest:
      description: "Update file content while preserving metadata"
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: "The new file content"
              mime-type:
                $ref: "#/components/schemas/SupportedMediaType"
                description: "Update MIME type if content type changes"

    TagsRequest:
      description: "Request body for tag operations"
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - tags
            properties:
              tags:
                $ref: "#/components/schemas/Tags"

    AccessPermissionsRequest:
      description: "Request body for access permission operations"
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - permissions
            properties:
              permissions:
                $ref: "#/components/schemas/AccessRights"



  responses:
    ### Success Responses

    FileContent:
      description: "Returns the file content with appropriate media type"
      content:
        text/html: {} # HTML
        image/jpeg: {} # JPG Image
        image/png: {} # PNG Image
        image/gif: {} # GIF Image
        application/msword: {} # Word (.doc)
        application/vnd.openxmlformats-officedocument.wordprocessingml.document: {} # Word (.docx)
        application/vnd.ms-excel: {} # Excel (.xls)
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {} # Excel (.xlsx)
        application/vnd.ms-powerpoint: {} # PowerPoint (.ppt)
        application/vnd.openxmlformats-officedocument.presentationml.presentation: {} # PowerPoint (.pptx)
        application/zip: {} # ZIP Archive
        application/pdf: {} # PDF File
        text/calendar: {} # ics File
        application/json:
          schema:
            $ref: "#/components/schemas/DirectoryProperties"

    ### Error Responses

    BadRequest:
      description: "bad request"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorSchema"

    Unauthorized:
      description: "unauthorized"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorSchema"

    Forbidden:
      description: "Forbidden"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorSchema"

    NotFound:
      description: "Requested resource was not found"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorSchema"

    Conflict:
      description: "Request conflicts with current state (e.g., file already exists)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorSchema"

    UnsupportedMediaType:
      description: "unsupported media type"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorSchema"

    InternalServerError:
      description: "internal server error"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorSchema"

  schemas:
    FileProperties:
      description: "Includes all the File Properties."
      type: object
      properties:
        fileId:
         $ref: "#/components/schemas/FileId"

        access:
         $ref: "#/components/schemas/AccessRights"

        metadata:
          $ref: "#/components/schemas/Metadata"

        tags:
          $ref: "#/components/schemas/Tags"

        locations:
          $ref: "#/components/schemas/FileLocation"

    DirectoryProperties:
      description: "Represents the response if a file is a directory."
      allOf:
        - $ref: "#/components/schemas/FileProperties"
        - $ref: "#/components/schemas/ArrayOfFileProperties"

    ArrayOfFileProperties:
      description: "An array of file properties."
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileProperties"

    ArrayOfFileIds:
      description: "An array of file ids."
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileId"

    Metadata:
      description: "Represents additional Metadata for a file"
      allOf:
      - $ref: "#/components/schemas/TimeMetadata"
      - type: object
      required:
        - type
        - name
        - ownerId
      properties:
        mime-type:
          $ref: "#/components/schemas/SupportedMediaType"
        name:
          $ref: "#/components/schemas/Filename"
        ownerId:
          $ref: "#/components/schemas/OwnerId"

    Filename:
      type: string
      description: "The name of the file."

    FileLocation:
      type: array
      items:
        $ref: "#/components/schemas/FileId"

    SupportedMediaType:
      description: "MIME type of the file"
      type: string
      enum:
        - text/html
        - image/jpeg
        - image/png
        - image/gif
        - application/msword
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.ms-excel
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.ms-powerpoint
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/zip
        - application/pdf
        - text/calendar
        - application/json

    TimeMetadata:
      type: object
      description: "Includes time related metadata."
      properties:
        createdAt:
          type: string
          format: date-time
          description: "Creation timestamp with seconds precision (ISO 8601)"
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
          description: "Timestamp of the last update with seconds precision (ISO 8601)"

    OwnerId:
      type: integer
      description: "Id to identify the Owner"

    AccessRights:
      type: object
      description: "Specifies which user has access to the file."
      properties:
        read:
          type: array
          items:
            $ref: "#/components/schemas/OwnerId"
        write:
          type: array
          items:
            $ref: "#/components/schemas/OwnerId"
        delete:
          type: array
          items:
            $ref: "#/components/schemas/OwnerId"

    Tags:
      description: "Tags associated with that file"
      type: array
      items:
        type: string

    FileId:
      description: "Used to identify a file."
      type: integer

    TagsResponse:
      description: "Response containing file tags"
      content:
        application/json:
          schema:
            type: object
            properties:
              file-id:
                $ref: "#/components/schemas/FileId"
              tags:
                $ref: "#/components/schemas/Tags"
              updated-at:
                type: string
                format: date-time

    AccessPermissionsResponse:
      description: "Response containing access permissions"
      content:
        application/json:
          schema:
            type: object
            properties:
              file-id:
                $ref: "#/components/schemas/FileId"
              permissions:
                $ref: "#/components/schemas/AccessRights"
              updated-at:
                type: string
                format: date-time


    ### Search Schemas

    SearchCriteria:
      description: "Search criteria for advanced file search."
      type: object
      properties:
        name:
          type: object
          properties:
            value:
              type: string
              description: "The filename to search for"
            mode:
              type: string
              enum: ["exact", "contains", "regex", "fuzzy"]
              default: "contains"
              description: "Search mode for filename matching"
        tags:
          type: object
          properties:
            values:
              type: array
              items:
                type: string
              description: "List of tags to search for"
            mode:
              type: string
              enum: ["any", "all", "exact"]
              default: "any"
              description: "How to match tags (any: OR, all: AND, exact: exact match)"
        ownerId:
          type: object
          properties:
            value:
              $ref: "#/components/schemas/OwnerId"
            mode:
              type: string
              enum: ["exact"]
              default: "exact"
        access:
          type: object
          properties:
            userId:
              $ref: "#/components/schemas/OwnerId"
            permission:
              type: string
              enum: ["read", "write", "delete"]
              description: "Check if user has specific permission"
        mime-type:
          type: object
          properties:
            values:
              type: array
              items:
                $ref: "#/components/schemas/SupportedMediaType"
              description: "List of MIME types to search for"
            mode:
              type: string
              enum: ["any", "exact"]
              default: "any"
        dateRange:
          type: object
          properties:
            field:
              type: string
              enum: ["createdAt", "updatedAt"]
              default: "createdAt"
              description: "Which date field to search"
            from:
              type: string
              format: date-time
              description: "Start date (inclusive)"
            to:
              type: string
              format: date-time
              description: "End date (inclusive)"
        locations:
          type: object
          properties:
            values:
              type: array
              items:
                $ref: "#/components/schemas/FileId"
              description: "List of location IDs to search in"
            mode:
              type: string
              enum: ["any", "all"]
              default: "any"

    SearchOptions:
      description: "Options for search behavior and result formatting."
      type: object
      properties:
        sort:
          type: array
          items:
            type: object
            required:
              - field
            properties:
              field:
                type: string
                enum: ["name", "createdAt", "updatedAt", "ownerId", "mime-type"]
                description: "Field to sort by"
              order:
                type: string
                enum: ["asc", "desc"]
                default: "asc"
                description: "Sort order"
        pagination:
          type: object
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 1000
              default: 100
              description: "Maximum number of results to return"
            offset:
              type: integer
              minimum: 0
              default: 0
              description: "Number of results to skip"
        caseSensitive:
          type: boolean
          default: false
          description: "Whether string searches should be case sensitive"

    SearchResults:
      description: "Generic search results container with metadata."
      type: object
      properties:
        results:
          oneOf:
            - $ref: "#/components/schemas/ArrayOfFileIds"
            - $ref: "#/components/schemas/ArrayOfFileProperties"
        totalCount:
          type: integer
          description: "Total number of results found"
        pagination:
          type: object
          properties:
            limit:
              type: integer
              description: "Number of results per page"
            offset:
              type: integer
              description: "Number of results skipped"
            hasMore:
              type: boolean
              description: "Whether there are more results available"

    FuzzySearchResults:
      description: "Results from fuzzy search with relevance scores."
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              file:
                oneOf:
                  - $ref: "#/components/schemas/FileId"
                  - $ref: "#/components/schemas/FileProperties"
              score:
                type: number
                minimum: 0
                maximum: 1
                description: "Relevance score (0.0 to 1.0, higher is better match)"
              matchedFields:
                type: array
                items:
                  type: string
                description: "Fields that contributed to the match"
        totalCount:
          type: integer
          description: "Total number of matches found"
        query:
          type: string
          description: "The original search query"
        threshold:
          type: number
          description: "The threshold used for matching"

    ### Error Schemas

    ErrorSchema:
      type: object
      properties:
        title:
          type: string
          description: "A short, human-readable summary of the problem"
        status:
          type: integer
          description: "The HTTP status code applicable to this problem"
        detail:
          type: string
          description: "A explanation specific to this occurrence of the problem"

    SecuritySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT

security:
  - bearerAuth: []